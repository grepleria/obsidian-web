# nginx config for the self-hosted client-only (OPFS) obsidian-web bundle.
#
# TEMPLATE: installed to /etc/nginx/templates/default.conf.template, so the
# official image's entrypoint envsubst-renders it at container start.
# ${OW_SYNC_UPSTREAM} is the only substituted variable — nginx runtime vars
# ($uri etc.) are untouched because envsubst only replaces DEFINED env vars.
#
# Replaces the two things Cloudflare's Worker (src/deployments/cloudflare/
# index.js) does that a plain static host cannot:
#
#   1. /starter and /vault/* -> return the app shell as a 200 (NOT a redirect).
#      The URL must stay /vault/<id> in the browser: boot.js reads the vault id
#      straight off the path, so a redirect to / would drop it and land the
#      visitor on the chooser instead of their vault.
#   2. Everything else -> static asset.
#
# NOT replicated: POST /api/proxy-request, the Worker's CORS-safe edge proxy for
# github.com / obsidian.md (community-plugin browse/install, plus one
# deprecated-plugins check on vault load). Deliberate for this deployment — the
# plugins this platform needs (LiveSync, layout switcher) ship IN the bundle via
# the system-plugin overlay, so nothing needs the proxy at runtime. The
# on-vault-load check degrades to a failed fetch the client already tolerates.
# If community-plugin installation is ever wanted here, that route needs a real
# implementation (an SSRF-safe allow-list proxy — see the Worker's
# proxy-worker.js), NOT a naive pass-through.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # OPFS needs a secure context. TLS terminates at the Pangolin edge, which
    # forwards plain HTTP here, so nothing to do in nginx — but note that
    # reaching this container directly over http://<ip>:8080 will NOT have a
    # working vault (navigator.storage.getDirectory is undefined off a secure
    # context). Always go through the edge hostname.

    # Long-cache the immutable vendored renderer + hashed assets; never the
    # shell (a stale index.html pins visitors to an old build's asset graph).
    location /obsidian-mobile/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Per-deployment page title. The image is byte-identical across vault
    # hosts, so the deployment (not the build) names the site: ${OW_TITLE}
    # is envsubst'd at container start, and sub_filter rewrites the shell's
    # static <title> as it is served. Runtime document.title updates from
    # Obsidian's own renderer (note names) are client-side and untouched —
    # this covers only the pre-boot/starter title. sub_filter_once: the tag
    # appears exactly once, stop scanning after it.
    location = /index.html {
        add_header Cache-Control "no-cache";
        sub_filter '<title>Obsidian Web</title>' '<title>${OW_TITLE}</title>';
        sub_filter_once on;
    }

    # sw.js must never be cached: it is the service worker that controls asset
    # caching, and a stale one keeps serving a previous build (upstream hit
    # exactly this — see seed-example-vault.js's cacheBust note).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Provisioned LiveSync settings, mounted in by the deployment (absent on a
    # plain build). Two things matter here:
    #   no-store — it carries live credentials, and a rotation must not be
    #     masked by a cached copy.
    #   =404 rather than the SPA fallback below — seed-livesync-config.js
    #     treats 404 as "this origin is not provisioned" and falls back to the
    #     manual flow. Letting the catch-all serve index.html instead would
    #     hand it HTML to parse as JSON, turning a clean opt-out into a
    #     confusing failure.
    location = /livesync-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Same-origin proxy to this deployment's CouchDB sync hub
    # (grepleria-configs plans/obsidian-vault-platform/layering-design.md §5).
    # The browser's couchDB_URI points HERE (https://<origin>/sync) instead of
    # a separate sync subdomain, which removes CouchDB CORS from the picture
    # entirely — critical once per-workspace origins are dynamic and CouchDB's
    # enumerable-origins CORS model cannot express them. One SSO gate (this
    # origin's) covers shell, config, and sync. The old public sync edge
    # remains only for native mobile clients.
    #
    # Proxy settings are shaped by LiveSync's traffic:
    #   buffering off        — the continuous/longpoll _changes feed must
    #                          stream, not accumulate in nginx buffers.
    #   request_buffering off, client_max_body_size 256m
    #                        — bulk_docs pushes carry chunk batches well past
    #                          nginx's 1m default, which would 413 mid-sync.
    #   read_timeout 3600s   — longpoll holds the connection open by design.
    #   trailing slash on proxy_pass strips the /sync/ prefix.
    location /sync/ {
        proxy_pass ${OW_SYNC_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        client_max_body_size 256m;
    }

    # SPA fallback for the Worker's two shell routes. try_files serves the real
    # file when one exists (so /vault/<id> never shadows a real asset path) and
    # otherwise returns the shell body at the current URL — a 200, not a 302.
    location /vault/ {
        try_files $uri $uri/ /index.html;
    }

    location = /starter {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
