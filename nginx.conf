# nginx config for the self-hosted client-only (OPFS) obsidian-web bundle.
#
# Replaces the two things Cloudflare's Worker (src/deployments/cloudflare/
# index.js) does that a plain static host cannot:
#
#   1. /starter and /vault/* -> return the app shell as a 200 (NOT a redirect).
#      The URL must stay /vault/<id> in the browser: boot.js reads the vault id
#      straight off the path, so a redirect to / would drop it and land the
#      visitor on the chooser instead of their vault.
#   2. Everything else -> static asset.
#
# NOT replicated: POST /api/proxy-request, the Worker's CORS-safe edge proxy for
# github.com / obsidian.md (community-plugin browse/install, plus one
# deprecated-plugins check on vault load). Deliberate for this deployment — the
# plugins this platform needs (LiveSync, layout switcher) ship IN the bundle via
# the system-plugin overlay, so nothing needs the proxy at runtime. The
# on-vault-load check degrades to a failed fetch the client already tolerates.
# If community-plugin installation is ever wanted here, that route needs a real
# implementation (an SSRF-safe allow-list proxy — see the Worker's
# proxy-worker.js), NOT a naive pass-through.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # OPFS needs a secure context. TLS terminates at the Pangolin edge, which
    # forwards plain HTTP here, so nothing to do in nginx — but note that
    # reaching this container directly over http://<ip>:8080 will NOT have a
    # working vault (navigator.storage.getDirectory is undefined off a secure
    # context). Always go through the edge hostname.

    # Long-cache the immutable vendored renderer + hashed assets; never the
    # shell (a stale index.html pins visitors to an old build's asset graph).
    location /obsidian-mobile/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # sw.js must never be cached: it is the service worker that controls asset
    # caching, and a stale one keeps serving a previous build (upstream hit
    # exactly this — see seed-example-vault.js's cacheBust note).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback for the Worker's two shell routes. try_files serves the real
    # file when one exists (so /vault/<id> never shadows a real asset path) and
    # otherwise returns the shell body at the current URL — a 200, not a 302.
    location /vault/ {
        try_files $uri $uri/ /index.html;
    }

    location = /starter {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
